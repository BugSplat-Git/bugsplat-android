plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'com.bugsplat.android'
    compileSdk 35

    // Enable BuildConfig generation
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdk 26
        targetSdk 35
        ndk {
            abiFilters 'arm64-v8a', 'x86_64', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                // Enable 16KB page size support for NDK r27
                // See: https://developer.android.com/guide/practices/page-sizes
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // Use uncompressed shared libraries with 16KB zip alignment (AGP 8.5.1+)
            useLegacyPackaging false
        }
        resources {
            // Replaced excludes with doNotStrip to preserve symbols in .so files
            doNotStrip '*/arm64-v8a/*.so'
            doNotStrip '*/x86_64/*.so'
            doNotStrip '*/armeabi-v7a/*.so'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/cpp/crashpad/lib', new File(buildDir, 'handlerWrapper')]
            // Ensure assets directory exists
            assets.srcDirs = ['src/main/assets']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            // CMake 3.22.1 is installed via Android SDK in CI
            // System CMake 3.20+ removed CMake Server mode that AGP requires
            version '3.22.1'
        }
    }

    ndkVersion '28.2.13676358'
}

mavenPublishing {
    // The Central Portal is the only host the plugin publishes to now, so the
    // SonatypeHost argument this used to take no longer exists.
    publishToMavenCentral()
    signAllPublications()

    // AGP 9 no longer exposes a publishable component implicitly; the plugin
    // declares the variant itself when told which one to publish. Called on the
    // extension explicitly because a bare configure() in a Groovy build script
    // resolves to Project.configure instead.
    delegate.configure(new com.vanniktech.maven.publish.AndroidSingleVariantLibrary('release', true, true))

    coordinates("com.bugsplat", "bugsplat-android", "1.4.0")

    pom {
        name = "BugSplat Android"
        description = "BugSplat crash reporting for Android"
        url = "https://github.com/BugSplat-Git/bugsplat-android"
        inceptionYear = "2024"

        licenses {
            license {
                name = "MIT License"
                url = "https://opensource.org/licenses/MIT"
            }
        }

        developers {
            developer {
                id = "bugsplat"
                name = "BugSplat"
                url = "https://www.bugsplat.com"
            }
        }

        scm {
            url = "https://github.com/BugSplat-Git/bugsplat-android"
            connection = "scm:git:https://github.com/BugSplat-Git/bugsplat-android.git"
            developerConnection = "scm:git:ssh://git@github.com/BugSplat-Git/bugsplat-android.git"
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    testImplementation libs.mockwebserver
    testImplementation 'org.json:json:20231013'
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}

// AGP 9 removed android.libraryVariants; onVariants is the replacement, and it
// runs early enough that the afterEvaluate wrapper is no longer needed.
androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        // AGP 9 only creates a bundle task for variants it can package, so match
        // rather than name it directly.
        tasks.matching { it.name == "bundle${variantName.capitalize()}Aar" }.configureEach {
            def aarOutputDir = layout.buildDirectory.dir("outputs/aar").get().asFile
            def originalFile = new File(aarOutputDir, "app-${variantName}.aar")
            def newFile = new File(aarOutputDir, "bugsplat-android-${variantName}.aar")

            doLast {
                if (originalFile.exists()) {
                    // Keep original for the maven publish task, copy with descriptive name for manual distribution
                    java.nio.file.Files.copy(originalFile.toPath(), newFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
    }
}